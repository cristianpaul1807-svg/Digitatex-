<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada — Digitatex</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0c0c0d">
<link rel="icon" href="/assets/logo.png">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#08080a;color:#efe9dd;text-align:center;padding:32px;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;position:relative;overflow:hidden}
  /* el mismo fondo que la web, para que no parezca que se salio del sitio */
  #bg{position:absolute;inset:0;background:url('/assets/space-bg.jpg') center/cover;opacity:0.75}
  #vig{position:absolute;inset:0;
    background:radial-gradient(ellipse 70% 70% at 50% 50%, rgba(8,8,10,0.55), rgba(8,8,10,0.94) 100%)}
  main{position:relative;max-width:34rem}
  .eb{font-size:11px;letter-spacing:0.3em;text-transform:uppercase;color:#e0be82}
  h1{font-family:Georgia,'Times New Roman',serif;font-weight:400;
    font-size:clamp(34px,7vw,58px);line-height:1.06;margin-top:18px;letter-spacing:-0.02em}
  p{margin-top:18px;font-size:15px;line-height:1.75;color:#c9c2b2}
  a.btn{display:inline-block;margin-top:30px;padding:14px 30px;border-radius:999px;
    background:#c9a05c;color:#14110f;text-decoration:none;font-size:13px;font-weight:500;
    letter-spacing:0.1em;text-transform:uppercase;transition:transform .25s ease,background .25s ease}
  a.btn:hover{background:#e0be82;transform:translateY(-2px)}
  .wm{margin-top:44px;font-family:Georgia,serif;font-size:13px;letter-spacing:0.28em;
    color:#a8a294;opacity:0.8}
</style>
</head>
<body>
<div id="bg"></div><div id="vig"></div>
<main>
  <p class="eb">Error 404</p>
  <h1>Esta página no existe.</h1>
  <p>El enlace está roto o la dirección se escribió mal. Todo lo que hacemos está en una sola página, y te llevamos ahí.</p>
  <a class="btn" href="/">Volver al inicio</a>
  <p class="wm">DIGITATEX</p>
</main>
</body>
</html>
