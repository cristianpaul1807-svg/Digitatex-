server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # El dominio con y sin www servian los dos la misma pagina con un 200. Google
  # lo resuelve por el canonical, pero es mas limpio que solo exista una.
  if ($host = www.digitatex.com) { return 301 https://digitatex.com$request_uri; }

  # Los videos de los casos se recorren segun la posicion del scroll, y eso
  # solo funciona si el servidor responde peticiones Range. Nginx las soporta
  # de fabrica; se deja explicito para que nadie lo desactive sin querer.
  max_ranges 100;

  # sendfile + Range se llevan mal si el buffer es muy grande
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  # los mp4 ya vienen comprimidos: gzip solo gastaria CPU sin ganar nada

  # El HTML no se cachea: asi un cambio en el sitio se ve al instante.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # La regla de arriba es de coincidencia exacta y no alcanza al hub de enlaces.
  # Importa: esa lista se edita a mano para anadir enlaces nuevos, y sin esto un
  # visitante que ya la haya abierto seguiria viendo la version vieja.
  location ~ ^/links/?(index\.html)?$ {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # Los prototipos se corrigen mientras el cliente los esta mirando, asi que
  # tampoco se cachea su HTML. El video de dentro si, que no cambia.
  location ~ ^/prototipi/.*\.html?$ {
    add_header Cache-Control "no-cache, must-revalidate";
  }
  location ~ ^/prototipi/.*/$ {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # El showcase del sistema de movimiento. Su HTML tampoco se cachea, que se
  # edita mientras se ensena; sus assets llevan hash en el nombre, asi que esos
  # si pueden cachearse de verdad.
  location ~ ^/motion/?(index\.html)?$ {
    add_header Cache-Control "no-cache, must-revalidate";
  }
  location /motion/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location /motion/media/ {
    add_header Cache-Control "public, max-age=604800";
    add_header Accept-Ranges bytes;
  }

  # Los assets son grandes y cambian poco. Se cachean una semana, no un ano,
  # porque los videos se reemplazan desde el panel y no llevan hash en el nombre.
  location /assets/ {
    add_header Cache-Control "public, max-age=604800";
    add_header Accept-Ranges bytes;
  }

  # robots.txt y sitemap.xml se sirven tal cual y sin cachear una semana: son
  # los dos archivos que Google vuelve a pedir cuando cambia algo.
  location = /robots.txt  { add_header Cache-Control "public, max-age=3600"; }
  location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; }

  # El SQL y la carpeta de skills no tienen por que servirse al publico.
  location = /supabase-setup.sql { return 404; }
  location ^~ /.claude/ { return 404; }

  # Antes cualquier direccion inventada devolvia la portada con un 200. Eso es
  # un "soft 404": Google lo detecta, lo cuenta como pagina rota y ademas se
  # llena el indice de copias de la home. El sitio es una sola pagina y no
  # tiene rutas propias, asi que lo que no existe tiene que decir que no existe.
  location / {
    try_files $uri $uri/ =404;
  }
  error_page 404 /404.html;
  location = /404.html { internal; }

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
